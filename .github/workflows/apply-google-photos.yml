name: Apply Google Photos integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply integration
        run: node scripts/enable-google-photos.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "Google Photos integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/components/views/PhotosView.tsx scripts/enable-google-photos.mjs src/utils/googlePhotosPicker.ts
          git commit -m "Add Google Photos Picker integration"
          git push
