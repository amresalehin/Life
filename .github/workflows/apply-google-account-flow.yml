name: Apply Google account-first Photos flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply account-first flow
        run: node scripts/enable-google-account-flow.mjs

      - name: Commit flow
        run: |
          if git diff --quiet; then
            echo "Google account-first flow already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/views/PhotosView.tsx scripts/enable-google-account-flow.mjs
          git commit -m "Make Google sign-in the Photos connection flow"
          git push
